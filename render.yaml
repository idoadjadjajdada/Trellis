# Render Blueprint: the Trellis app (Docker) plus Postgres with pgvector.
# Deploy: Render Dashboard → New → Blueprint → pick this repo, or use the button in the README.
# The app finds its public address from RENDER_EXTERNAL_URL. If you add a custom domain,
# set PUBLIC_URL to it BEFORE creating your account (passkeys are tied to the host name).
services:
  - type: web
    name: trellis
    runtime: docker
    # starter does not sleep, so AI connectors never hit a cold start. The app peaks
    # around 380 MB with the embedding model loaded, so do not go below 512 MB of RAM.
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trellis-db
          property: connectionString
      - key: TRUST_PROXY
        value: "true"
      - key: EMBEDDING_PROVIDER
        value: local
      # Turn this to "false" in the Dashboard after you create your account.
      - key: ALLOW_SIGNUP
        value: "true"
      - key: PUBLIC_URL
        sync: false

databases:
  - name: trellis-db
    plan: basic-256mb
    databaseName: trellis
    user: trellis
    postgresMajorVersion: "16"
    # Only the app (over Render's private network) can reach the database.
    ipAllowList: []
